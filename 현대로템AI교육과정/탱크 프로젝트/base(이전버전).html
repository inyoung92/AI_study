<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Tank Mini Map{% endblock %}</title>
  <!-- Bootstrap for responsive layout -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 20px;
      background: #f0f0f0;
      font-family: sans-serif;
    }
    .mission {
      background: #c4c4c4;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
    }
    .mission-panel {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .mission-button {
      background: transparent;
      border: 2px solid #000;
      color: #39ff14;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mission-button:hover,
    .mission-button.active {
      background: #464851;
      color: #fff;
    }
    .map-container {
      width: 300px;
      height: 300px;
      position: relative;
      border: 1px solid #333;
      background: #eee;
    }
  </style>
  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <h2 class="text-center">Tank Mini Map</h2>
  <div class="mission">
    <h3>작전하달</h3>
    <p>정찰을 돌다가 적 발견 시 엄폐 후 적을 섬멸하라!</p>
  </div>
  <div class="mission-panel">
    <button class="mission-button" data-command="저격">저격</button>
    <button class="mission-button" data-command="엄폐">엄폐</button>
    <button class="mission-button" data-command="격파">격파</button>
    <button class="mission-button" data-command="후퇴">후퇴</button>
  </div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <script>
    // 단일 Socket.IO 연결
    const socket = io('http://localhost:5000');
    socket.on('connect', () => console.log('Connected to server'));
    socket.on('connect_error', (error) => console.error('SocketIO connection error:', error));

    // 명령 버튼 이벤트
    document.querySelectorAll('.mission-button').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        const command = btn.dataset.command;
        console.log(`Command: ${command} ${btn.classList.contains('active') ? 'selected' : 'deselected'}`);
        fetch('http://localhost:5000/get_action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command })
        })
        .then(res => res.json())
        .then(data => console.log('Action response:', data))
        .catch(err => console.error('Action error:', err));
      });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
